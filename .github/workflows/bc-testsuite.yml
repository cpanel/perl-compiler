name: B::C testsuite

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-a-docker-container-action

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
  pull_request:

jobs:
  cprove:
    env:
      PERL_USE_UNSAFE_INC: 0
      AUTHOR_TESTING: 1
      AUTOMATED_TESTING: 1
      RELEASE_TESTING: 1
      VERBOSE: 0
      BC_DEVELOPING: 0
      WARNINGS: 0
      PERL_SKIP_TTY_TEST: 1

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      # Limit: 20 total concurrent jobs for 'Free' GitHub plan
      #   https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
      matrix:
        test_dir:
          - "base/*.t"
          - "bctestc/*.t"
          - "comp/*.t"
          - "extra/*.t"
          - "io/*.t"
          - "mro/*.t"
          - "op/[0-9a-e]*.t"
          - "op/[f-m]*.t"
          - "op/[n-s]*.t"
          - "op/[t-z]*.t"
          - "re/[a-f]*.t"
          - "re/[g-q]*.t"
          - "re/r*.t"
          - "re/[s-z]*.t"
          - "uni/*.t"

    container:
      image: ghcr.io/webpros-cpanel/cpanel-perl-container@sha256:4e9a835172fe6261135b0be526f376ac12e0a94791405fe32bd7fdff99f03685

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: setup
        run: |
          cat /etc/lsb-release
          mv /etc/apt/sources.list.d/cpanel.list /etc/apt/sources.list.d/cpanel.list.off ||:
          # apt-get update
          # apt-get install -y \
      - run: perl -V
      - name: which perl
        run: ls -l $(which perl)
      - name: ls
        run: ls -l
      - name: make
        run: perl Makefile.PL installdirs=vendor
      - name: make install
        run: make -j4 install
      - name: setup PATH
        run: echo "/usr/local/cpanel/3rdparty/perl/540/bin:$PATH" >> $GITHUB_PATH
      - run: ls -l /usr/local/cpanel/3rdparty/perl/540/bin/perlcc
      - name: which perlcc
        run: which perlcc
      - run: which git
      - name: "running test ${{ matrix.test_dir }}"
        run: ./cprove -j4 ${{ matrix.test_dir }}
