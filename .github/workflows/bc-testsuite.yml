name: B::C testsuite

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-a-docker-container-action

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
  pull_request:

jobs:
  cprove:
    env:
      PERL_USE_UNSAFE_INC: 0
      AUTHOR_TESTING: 1
      AUTOMATED_TESTING: 1
      RELEASE_TESTING: 1
      VERBOSE: 0
      BC_DEVELOPING: 0
      WARNINGS: 0
      PERL_SKIP_TTY_TEST: 1

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    container:
      image: cpanelos/perl-compiler:perl-v5.35.10

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - run: perl -V
      - name: which perl
        run: ls -l $(which perl)
      - name: ls
        run: ls -l
      - name: make
        run: perl Makefile.PL installdirs=vendor
      - name: make install
        run: make -j4 install
      - name: setup PATH
        run: echo "/usr/local/cpanel/3rdparty/perl/535/bin:$PATH" >> $GITHUB_PATH
      - run: ls -l /usr/local/cpanel/3rdparty/perl/535/bin/perlcc
      - name: which perlcc
        run: which perlcc
      - name: "running test"
        run: ./cprove -v op/stat.t
